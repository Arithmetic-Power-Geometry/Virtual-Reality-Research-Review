name: RDW N09 computational cost
on:
  push:
    paths:
      - '.github/workflows/rdw-n09-cost.yml'
jobs:
  cost:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: benchmarks/redirected_walking}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pytest
      - run: pytest -q
      - run: python n09_cost_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: n09-cost-results
          retention-days: 90
          path: benchmarks/redirected_walking/artifacts/n09_cost/
