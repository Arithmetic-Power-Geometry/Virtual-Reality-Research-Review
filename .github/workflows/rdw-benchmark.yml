name: RDW baseline benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - 'benchmarks/redirected_walking/**'
      - '.github/workflows/rdw-benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks/redirected_walking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deterministic benchmark
        run: |
          python -m pip install pytest
          pytest -q
      - name: Generate baseline results
        run: python rdw_benchmark.py --config config.json --output results.csv
      - name: Generate machine-readable summary
        run: python summarize.py results.csv --out summary.json
      - name: Hash generated files
        run: sha256sum results.csv summary.json > SHA256SUMS.txt
      - name: Generate R1 paired geometry sensitivity artifacts
        run: python r1_geometry_sensitivity.py
      - uses: actions/upload-artifact@v4
        with:
          name: rdw-baseline-results
          path: |
            benchmarks/redirected_walking/results.csv
            benchmarks/redirected_walking/summary.json
            benchmarks/redirected_walking/SHA256SUMS.txt
            benchmarks/redirected_walking/artifacts/r1_geometry_sensitivity/r1_geometry_runs.csv
            benchmarks/redirected_walking/artifacts/r1_geometry_sensitivity/r1_geometry_summary.csv
            benchmarks/redirected_walking/artifacts/r1_geometry_sensitivity/r1_manifest.json
            benchmarks/redirected_walking/artifacts/r1_geometry_sensitivity/r1_failures.json
            benchmarks/redirected_walking/artifacts/r1_geometry_sensitivity/SHA256SUMS.json
