name: RDW N02 corrected short gate
on:
  push:
    paths:
      - 'benchmarks/redirected_walking/r1_geometry_sensitivity.py'
      - 'benchmarks/redirected_walking/test_n02_navigation_execution.py'
      - '.github/workflows/rdw-n02-corrected-short.yml'
jobs:
  short-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks/redirected_walking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q
      - name: Run corrected 10-seed x 4-scene 35m gate
        run: python r1_geometry_sensitivity.py
      - uses: actions/upload-artifact@v4
        with:
          name: n02-corrected-short
          retention-days: 90
          path: benchmarks/redirected_walking/artifacts/r1_geometry_sensitivity/
