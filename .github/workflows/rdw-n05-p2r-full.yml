name: RDW N05 P2R full gate
on:
  push:
    paths:
      - '.github/workflows/rdw-n05-p2r-full.yml'
jobs:
  preflight:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: benchmarks/redirected_walking}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pytest
      - run: pytest -q
      - run: python n05_p2r_full.py --seed-start 901 --seed-count 2 --target-m 20 --outdir artifacts/n05_p2r_preflight
  full:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults: {run: {working-directory: benchmarks/redirected_walking}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python n05_p2r_full.py --seed-start 1001 --seed-count 100 --target-m 350 --outdir artifacts/n05_p2r_full
      - uses: actions/upload-artifact@v4
        with:
          name: n05-p2r-full-results
          retention-days: 90
          path: benchmarks/redirected_walking/artifacts/n05_p2r_full/
